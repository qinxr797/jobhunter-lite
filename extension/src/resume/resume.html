<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>定制简历</title>
  <link rel="stylesheet" href="resume.css">
</head>
<body>
  <div class="toolbar">
    <div class="tb-main">
      <strong id="tb-title">定制简历</strong>
      <span class="tb-actions">
        <button id="btn-pdf" class="primary">下载 PDF</button>
        <button id="btn-print">打印 / 另存</button>
      </span>
    </div>
    <p id="tb-plan" class="tb-note"></p>
    <ul id="tb-reasons" class="tb-note"></ul>
    <p id="tb-status" class="tb-note"></p>
  </div>
  <div class="page" id="page"></div>
  <script type="module" src="resume.js"></script>
</body>
</html>
