<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>网申</title>
<style>
  html, body { margin: 0; height: 100%; background: #fafafa; color: #09090b; font: 14px/1.7 "Microsoft YaHei UI", system-ui, sans-serif; }
  .wrap { max-width: 520px; margin: 14vh auto 0; padding: 0 24px; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { color: #52525b; margin: 6px 0; }
  ol { color: #52525b; padding-left: 20px; }
  .box { margin-top: 18px; padding: 12px 14px; border: 1px solid #e4e4e7; border-radius: 8px; background: #fff; color: #71717a; font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>网申通道</h1>
  <p>在右边贴网申链接，页面就在这里打开。</p>
  <ol>
    <li>登录（验证码、滑块你来）</li>
    <li>停在简历表单那页，点右边「填这一页」</li>
    <li>看红黄标记，补完、核对</li>
    <li>「提交」永远你自己点</li>
  </ol>
  <div class="box">这里的登录和 BOSS、智联、51job 分开存，互不影响。</div>
</div>
</body>
</html>
