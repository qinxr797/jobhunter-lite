<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HR 收件箱</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2318181b'/%3E%3Cpath d='M8 17h4l2 3h4l2-3h4M8 17l2.5-7h11L24 17v5a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1z' fill='none' stroke='white' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <aside id="side"></aside>
  <section id="list">
    <header class="list-head">
      <div class="list-title"><span id="viewName">要你处理</span><span id="viewCount"></span><div class="menu" id="listMenu"></div></div>
      <label class="search"><svg class="i"><use href="#i-search"/></svg><input id="q" placeholder="搜公司、HR、聊天内容"><kbd>/</kbd></label>
      <div class="chips-row" id="chips"></div>
    </header>
    <div id="items" tabindex="-1" role="listbox" aria-label="会话列表"></div>
  </section>
  <main id="reader"></main>
</div>
<div id="toasts"></div>
<div id="help" class="modal" hidden>
  <div class="modal-card">
    <h3>快捷键</h3>
    <dl>
      <dt><kbd>J</kbd> <kbd>K</kbd></dt><dd>下一家 / 上一家</dd>
      <dt><kbd>/</kbd></dt><dd>搜索</dd>
      <dt><kbd>R</kbd></dt><dd>去回复框</dd>
      <dt><kbd>Ctrl</kbd> + <kbd>Enter</kbd></dt><dd>发送（5 秒内能撤销）</dd>
      <dt><kbd>E</kbd></dt><dd>标成已处理（能撤销）</dd>
      <dt><kbd>M</kbd></dt><dd>稍后再看（3 小时）</dd>
      <dt><kbd>1</kbd> 到 <kbd>5</kbd></dt><dd>切左边的视图</dd>
      <dt><kbd>Tab</kbd> <kbd>Enter</kbd></dt><dd>键盘走到列表里的一家，回车打开</dd>
      <dt><kbd>Esc</kbd></dt><dd>关掉弹框 / 菜单 / 退出输入框</dd>
    </dl>
    <div class="modal-acts"><button class="btn" data-act="closeHelp">知道了</button></div>
  </div>
</div>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <!-- 图标来自 Lucide（ISC 许可） -->

    <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01z"/></symbol>
    <symbol id="i-hourglass" viewBox="0 0 24 24"><path d="M5 22h14M5 2h14M17 22v-4.17a2 2 0 0 0-.59-1.42L12 12l-4.41 4.41A2 2 0 0 0 7 17.83V22M7 2v4.17a2 2 0 0 0 .59 1.42L12 12l4.41-4.41A2 2 0 0 0 17 6.17V2"/></symbol>
    <symbol id="i-bot" viewBox="0 0 24 24"><path d="M12 8V4H8"/><rect x="4" y="8" width="16" height="12" rx="2"/><path d="M2 14h2M20 14h2M15 13v2M9 13v2"/></symbol>
    <symbol id="i-hand" viewBox="0 0 24 24"><path d="M18 11V6a2 2 0 0 0-4 0v5M14 10V4a2 2 0 0 0-4 0v6M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M5 3 2 6M22 6l-3-3"/></symbol>
    <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 2 10 5-10 5L2 7z"/><path d="m2 17 10 5 10-5M2 12l10 5 10-5"/></symbol>
    <symbol id="i-mute" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m4.9 4.9 14.2 14.2"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6M9 9l6 6"/></symbol>

    <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></symbol>

    <symbol id="i-sparkles" viewBox="0 0 24 24"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3z"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-power" viewBox="0 0 24 24"><path d="M12 2v10M18.4 6.6a9 9 0 1 1-12.77.04"/></symbol>
    <symbol id="i-msg" viewBox="0 0 24 24"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22z"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="i-pen" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></symbol>
    <symbol id="i-quote" viewBox="0 0 24 24"><path d="M17 6H3M21 12H3M15 18H3"/></symbol>

    <symbol id="i-file" viewBox="0 0 24 24"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/></symbol>
