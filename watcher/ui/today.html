<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>今天</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2318181b'/%3E%3Cpath d='M10 16.5l4 4 8-9' fill='none' stroke='white' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="today.css">
</head>
<body>
<div id="page">
  <header class="top">
    <div class="day">
      <h1>今天</h1>
      <span id="date" class="date"></span>
    </div>
    <div id="watch" class="watch" aria-live="polite"></div>
  </header>
  <main id="groups" aria-label="今天要你动手的事"></main>
  <footer id="report" class="report"></footer>
</div>
<div id="toasts"></div>
<div id="help" class="modal" hidden>
  <div class="modal-card">
    <h2>快捷键</h2>
    <dl>
      <dt><kbd>J</kbd> <kbd>K</kbd></dt><dd>下一件 / 上一件</dd>
      <dt><kbd>Enter</kbd></dt><dd>做这件（去消息 / 回复 / 去平台）</dd>
      <dt><kbd>E</kbd></dt><dd>完成：从今天的清单拿掉，不会给 HR 发东西（5 秒内能撤销）</dd>
      <dt><kbd>M</kbd></dt><dd>稍后：再按 <kbd>1</kbd> 一小时、<kbd>2</kbd> 今晚、<kbd>3</kbd> 明早</dd>
      <dt><kbd>Z</kbd></dt><dd>撤销刚才那下</dd>
      <dt><kbd>Esc</kbd></dt><dd>关掉菜单 / 弹框</dd>
    </dl>
    <div class="modal-acts"><button class="btn" data-act="closeHelp">知道了</button></div>
  </div>
</div>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <!-- 图标来自 Lucide（ISC 许可） -->
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></symbol>
    <symbol id="i-msg" viewBox="0 0 24 24"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22z"/></symbol>
    <symbol id="i-ext" viewBox="0 0 24 24"><path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol>
    <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3M12 17h.01"/></symbol>
    <symbol id="i-party" viewBox="0 0 24 24"><path d="M5.8 11.3 2 22l10.7-3.79M4 3h.01M22 8h.01M15 2h.01M22 20h.01"/><path d="m22 2-2.24.75a2.9 2.9 0 0 0-1.96 3.12c.1.86-.57 1.63-1.45 1.63h-.38c-.86 0-1.6.6-1.76 1.44L14 10M22 13l-.82-.33c-.86-.34-1.82.2-1.98 1.11-.11.7-.72 1.22-1.43 1.22H17M11 2l.33.82c.34.86-.2 1.82-1.11 1.98-.7.1-1.22.72-1.22 1.43V7"/><path d="M11 13c1.93 1.93 2.83 4.17 2 5-.83.83-3.07-.07-5-2-1.93-1.93-2.83-4.17-2-5 .83-.83 3.07.07 5 2"/></symbol>
  </defs>
</svg>
<script src="today.js"></script>
</body>
</html>
