<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>投递总表</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2318181b'/%3E%3Cpath d='M9 10h14M9 16h14M9 22h9' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="apps.css">
</head>
<body class="apps">
<!-- 投递页只回答一个问题：我投过的都到哪一步了。视图芯片 → 筛选 → 表格 / 看板 → 右侧抽屉 -->
<header class="a-top">
  <h1>投递</h1>
  <nav class="a-views" id="views" role="tablist" aria-label="视图"></nav>
  <div class="a-right">
    <div class="a-mode" role="group" aria-label="表格或看板">
      <button data-mode="table" title="表格（V 切换）"><svg class="i"><use href="#i-table"/></svg><span>表格</span></button>
      <button data-mode="board" title="看板（V 切换）"><svg class="i"><use href="#i-board"/></svg><span>看板</span></button>
    </div>
    <small class="a-ver" id="ver"></small>
  </div>
</header>
<div class="a-fbar">
  <div class="a-facets" id="facets"></div>
  <label class="search a-q"><svg class="i"><use href="#i-search"/></svg><input id="fq" placeholder="搜公司、岗位、动静" autocomplete="off"><kbd>/</kbd></label>
</div>
<div id="alert" class="a-alert" hidden></div>
<div class="a-tbar" id="tbar"></div>
<main class="a-main">
  <div class="a-scroll" id="tscroll"><table id="table"><thead id="thead"></thead><tbody id="tbody"></tbody></table><div id="tempty"></div></div>
  <div class="a-board" id="board" hidden></div>
</main>
<aside id="drawer" class="a-drawer" hidden aria-label="投递详情"></aside>
<div id="toasts"></div>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <!-- 图标来自 Lucide（ISC 许可），和收件箱同一套 -->
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="i-ext" viewBox="0 0 24 24"><path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></symbol>
    <symbol id="i-msg" viewBox="0 0 24 24"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22z"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-15-6.7L3 13"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
    <symbol id="i-filter" viewBox="0 0 24 24"><path d="M22 3H2l8 9.46V19l4 2v-8.54z"/></symbol>
    <symbol id="i-table" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 9v12"/></symbol>
    <symbol id="i-board" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M15 3v18"/></symbol>
    <symbol id="i-search-co" viewBox="0 0 24 24"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 9h1M14 9h1M9 13h1M14 13h1M9 17h1M14 17h1"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/></symbol>
  </defs>
</svg>
<script src="apps.js"></script>
</body>
</html>
